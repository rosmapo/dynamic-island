exec = "builtin:disk:/"   # uprav na svoj pripojný bod
[[menu.item]]
label = "Data: {}"
exec = "builtin:disk:/media/mm/Data"   # uprav na svoj pripojný bod
[[menu.item]]
label = "{} %"
exec = "builtin:disk-pct:/"   # uprav na svoj pripojný bod
[[menu.item]]
label = "{} %"
exec = "builtin:disk-pct:/media/mm/Data"   # uprav na svoj pripojný bod
[[menu.item]]
label = "Efi: {}"
exec = "builtin:disk:/boot/efi"
[[menu.item]]
label = "Backup: {}"
exec = "builtin:disk:/media/mm/backup"   # uprav na svoj pripojný bod
[[menu.item]]
label = "{} %"
exec = "builtin:disk-pct:/boot/efi"
[[menu.item]]
label = "{} %"
exec = "builtin:disk-pct:/media/mm/backup"   # uprav na svoj pripojný bod

[[menu.item]]
separator = true

#[[menu.item]]
#label = "Teplota: {}"
#exec = "builtin:temp"                     # builtin:temp:NÁZOV = konkrétny snímač (napr. coretemp, nvme)
#interval = 5
[[menu.item]]
