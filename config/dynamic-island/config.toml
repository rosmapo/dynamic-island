# Konfigurácia dynamic-island – skopíruj do ~/.config/dynamic-island/config.toml.
# Zmena súboru = automatický reštart. Farby sa berú z matugen súboru (colors_file) a menia sa ŽIVO.
#
# Prehľad:  1 Poradie modulov · 2 Vzhľad ostrovčeka · 3 Kontajner a spúšťač (quickset, drun)
#           4 Moduly lišty · 5 Panely a nástroje · 6 HUD a systém · 7 Notifikácie · 8 Vlastné menu

# ============================================================================
# 1. PORADIE MODULOV V LIŠTE
# ============================================================================

# poradie modulov (ako group/island vo waybare)
modules = ["network", "vpn", "clock", "keyboard", "audio", "radio", "media", "capslock", "inhibitor", "recorder", "quick", "disks"]


# ============================================================================
# 2. VZHĽAD OSTROVČEKA
# ============================================================================

[island]
colors_file = "~/.config/dynamic-island/colors.css"   # @define-color surface / primary ...
font_family = ["Inter"]
icon_family = ["Symbols Nerd Font Mono"]
font_size   = 17
# font_scale = 1.0   # násobiteľ VŠETKÝCH písem (kapsula aj panely); napr. 1.15 = o 15 % väčšie
height      = 34        # výška kompaktného ostrovčeka (px)
margin_top  = 6
radius      = 17        # zbalený (kapsula)
radius_expanded = 20    # s kalendárom / tooltipom
opacity     = 0.7      # krytie pozadia (ako alpha(@surface, 0.75))
shadow      = true
surface_width  = 760    # priehľadný povrch; myš prijíma len samotný ostrovček
surface_height = 580
tooltip_delay_ms  = 450
collapse_delay_ms = 200
poll_ms = 300           # kontrola caps/inhibitor/rec/rozloženia

[colors]  # voliteľné prepisy: "@meno" z colors_file alebo "#rrggbb"
# background = "@surface"
# foreground = "@primary"
# alert      = "#dc2f2f"
menu_selected      = "@secondary"   # pozadie vybranej položky
menu_selected_text = "@surface"   # text vybranej položky


# ============================================================================
# 3. KONTAJNER A SPÚŠŤAČ
# ============================================================================

# --- quickset: kontajner s lištou záložiek a druhou (inversetab) lištou ---
[quickset]
tabs_position = "left"   # left | right | top | bottom
tab_size = 44            # strana tlačidla záložky (px)
icon_size = 22           # veľkosť ikony (px)
tab_gap = 10      # px, 0–64, predvolene 6
width = 544            # celková šírka okna vrátane lišty; bez nej podľa aktívnej záložky
# height = 420           # celková výška okna vrátane lišty; bez nej podľa najvyššej záložky
preload = false        # predvolene true: údaje monitora sa načítajú už pri otvorení kontajnera (ddcutil je pomalý)

# poradie a výber záložiek; ikona je Nerd Font glyf (chýbajúca = predvolená)
tab1 = "menu:settings"          # názov z [[menu]] name = "nastavenia"
tab2 = "wifi"
tab3 = "bluetooth"
tab4 = "monitor"
tab5 = "audio"
tab6 = "menu:radio"				# povolené sú aj clipboard, trash, notifications a wallpaper
tab1_icon = ""          # ikona je voliteľná, predvolene ozubené koleso "\U000f0493"
tab2_icon = ""
tab3_icon = ""
tab4_icon = ""
tab5_icon = ""
tab6_icon = "" 		# 

# Druhá lišta na opačnej strane. tlačidlá neotvárajú panel v kontajneri.
inversetab = true
inversetab_gap = 10			# pre 5 tlacidiel gap=23
inversetab1 = "sudo poweroff"
inversetab2 = "sudo reboot"
inversetab3 = "systemctl suspend"
inversetab4 = "logout_to_tty.sh"
inversetab5 = "swaylock -f -i /home/mm/.config/wayfire/media/lockscreen.jpg --show-keyboard-layout --indicator-radius 100 --indicator-thickness 7"
inversetab6 = "module:capture"
inversetab1_icon = ""
inversetab2_icon = ""
inversetab3_icon = ""
inversetab4_icon = "󰍃"
inversetab5_icon = ""
inversetab6_icon = "󱣴"

# --- drun: spúšťač aplikácií (dynamic-island --drun, modul "drun") ---
[drun]					# librsvg2-bin nainstalovat kvoli konverzii svg ikon
# columns = 5
rows = 3
order = "vertical"    # "horizontal" = ďalšia aplikácia vedľa predošlej, "vertical" = pod predošlou
show = "icon"           # "icon" | "name" | "icon+name-right" | "icon+name-below"
# icon_size = 64
name_size = 18
# cell_width = 0          # 0 = podľa režimu a veľkostí
# cell_height = 0
# padding = 15
# radius = 30             # zaoblenie okna
# cell_radius = 15        # zaoblenie zvýraznenej bunky
hover = false            # zvýraznenie bunky pod ukazovateľom
# search = false          # riadok hľadania vždy viditeľný (písaním sa filtruje aj bez neho)
# terminal = "foot"       # pre aplikácie s Terminal=true
# icon_theme = ""         # prázdne = téma z nastavení GTK (gtk-icon-theme-name), inak hicolor; napr. "Papirus"
# desktop = ""            # napr. "Wayfire" pre OnlyShowIn / NotShowIn; prázdne = nekontrolovať


# ============================================================================
# 4. MODULY LIŠTY
# (poradie a zobrazenie určuje `modules` hore)
# ============================================================================

[clock]
format = "%A  %d. %B,  %H:%M"
locale = "sk_SK.UTF-8"
on_click = "calendar"                        # kalendár sa rozbalí priamo v ostrovčeku
# on_click_middle = "drun"
on_click_right = "notifications"

[network]
interface = "wlan0"
on_click = "~/.config/wayfire/scripts/VPN_switcher.sh"
on_click_right = "anydesk"
# icons = [...]  icon_ethernet  icon_disconnected   (predvolene Nerd Font ako vo waybare)
# Tooltipy (zástupné symboly: {ssid} {ifname} {ip} {gateway} {signal} {dbm} {freq}; \n = nový riadok):
# tooltip_wifi = "SSID: {ssid}\nIP adresa: {ip}\nSila signálu: {signal}% ({dbm} dBm)"
tooltip_wifi = ""
# tooltip_ethernet = "Rozhranie: {ifname}\nIP adresa: {ip}\nBrána: {gateway}"
# tooltip_disconnected = "Nepripojené"

[vpn]
interfaces = ["tun*"]
text = "VPN"
tooltip = ""
# tooltip = "{ifname}: {ip}"
on_click = "remmina -c /home/mm/.local/share/remmina/group_rdp_pc-práca_192-168-1-35.remmina"
on_click_right = "remmina"

[keyboard]
on_click = "layout-toggle"
on_click_right = "clipboard"
on_click_middle = ""
tooltip = ""
[keyboard.names]
Slovak = "SK"
"English (US)" = "US"

[audio]               # odznak sa zobrazí len pri stlmení; zmena hlasitosti ukáže HUD
on_click = "audio-mute"   # natívne (wpctl); skript Volume.sh netreba
step = 5                  # krok skratiek v %
limit = 1.0               # strop hlasitosti (1.0 = 100 %)
hud = true
hud_ms = 1000
panel_font_size = 16
panel_width = 420
panel_rows = 10

# Práve hrá (MPRIS: fooyin, mpv s mpris, prehliadač…). Ikona sa ukáže, kým je nejaký prehrávač aktívny.
# Klik = panel (neukončí sa odchodom myši, zbalí sa šípkou), pravý = play/pauza, stredný = ďalšia skladba.
# Akcie: media, media-play-pause, media-next, media-prev (v menu s predponou module:).
[media]
#icon = ""             # ikona pri prehrávaní
#icon_paused = ""      # ikona pri pozastavení
tooltip = ""			# tooltip = "{artist} – {title}"   # + {album}
# ignore = ["chromium"]       # prehrávače, ktoré sa majú preskočiť (podreťazec mena na zbernici)
# panel_width = 460
# art_size = 128              # veľkosť obalu (80–256 px)
# font_size = 16

[radio]                 # voliteľné
icon = ""
tooltip = "{name}"   # {name} = label položky
on_click_right = "radio"

[recorder]
on_click = "capture-stop"

[inhibitor]            # ikona len zobrazuje existenciu súboru; vytvára/maže ho tvoj skript na Super+Z
file = "/tmp/idleinhibit"
on_click = ""
tooltip = ""

[capslock]
text = "CAPS"

# Externé disky a flash kľúče (náhrada udiskie + waybar-eject.py): UDisks2 cez D-Bus.
# Modul sa zobrazí, len keď je niečo pripojené. Ľavý klik = pri jednom disku ho rovno odpojí, pri viacerých otvorí menu (klik na riadok odpojí a vysunie),
# pravý klik = odpojiť všetko. Menu sa zavrie, keď odídeš myšou.
[disks]
automount = true      # automaticky pripájať nové médiá
notify = true         # notifikácie o pripojení / odpojení / chybách
notify_timeout_ms = 2000   # ako dlho zostanú na obrazovke (rovnaký pre všetky); 0 = nevyprší
icon = ""      # nf-fa-usb
format = "{icon}"               # jeden disk
format_many = "{icon} {count}"  # viac diskov (počíta sa disk, nie oddiel); {icon} {count} {label}
tooltip = "{list}"    # {list} = „názov (veľkosť)  →  bod pripojenia“ po riadkoch
# on_click = "menu"   # "menu" | "eject-all" | príkaz
# on_click_right = "eject-all"

# --- Vlastné moduly ([[custom]]) ---
# Ľubovoľný externý modul: trvalý proces (interval = 0) alebo periodický.
# Výstup: JSON {"text","tooltip","class"} alebo čistý text (json = false).
[[custom]]
name = "quick"
text = ""			#    
on_click = "quickset"
on_click_right = "~/.config/wayfire/scripts/wallpaper -r"
# tooltip = "Leftt-click: quick setting, Right-click: random wallpaper"

# Odznak v lište len kým existuje súbor (track_file), tvar ako CAPS; prázdne track_file = bežný modul.
# [[custom]]
# name = "busy"
# text = "BUSY"
# track_file = "/tmp/busy"

##### [[custom]]
##### name = "ram"
##### exec = "awk '/MemTotal/{t=$2} /MemAvailable/{a=$2} END{printf \"\uf2db %.1f GB\", (t-a)/1048576}' /proc/meminfo"
##### interval = 5
##### json = false
##### tooltip = "Použitá pamäť"

# [[custom]]
# name = "sett"
# text = ""		# 
# on_click = "settings"
# on_click_right = "backup"


# ============================================================================
# 5. PANELY A NÁSTROJE
# (otvárajú sa z modulov, záložiek kontajnera alebo menu cez module:meno)
# ============================================================================

[clipboard]
font_size = 17    # veľkosť písma
rows = 10          # koľko riadkov je vidieť, viac = skrolovanie
width = 600       # šírka panela
max_items = 200   # koľko najnovších položiek sa načíta
# list_command = "cliphist list"
# copy_command = "cliphist decode | wl-copy"

[trash]
width = 600
rows = 10
text_size = 17
confirm_empty = false
show_location = false
show_date = true

[wallpaper]
directory = "~/.config/wayfire/media/wallpaper"
columns = 4
rows = 4
thumb_width = 160
command = "~/.config/wayfire/scripts/wallpaper"
cache_dir = "~/.cache/wallpaper-chooser"
themes_directory = "~/.config/matugen/themes"
theme_width = 190
hover_ring = false     # rámik okolo náhľadu pod kurzorom
current_ring = false   # rámik okolo aktuálne nastavenej tapety
# button_max_width = 120
button1_label = "GTK"
button1_command = "nwg-look"
button2_label = "Kvantum"
button2_command = "kvantummanager"
button3_label = "qt5"
button3_command = "qt5ct"
button4_label = "qt6"
button4_command = "qt6ct"

[wifi]
font_size = 16
rows = 8
width = 500
editor_command = "nm-connection-editor"
editor_label = ""		# text a / alebo editor_icon = "\U000f0493"; bez nich (alebo s prázdnym editor_command) sa tlačidlo nezobrazí

[bluetooth]			# sudo apt install bluez-tools   # bt-agent
width = 450
font_size = 16
rows = 8
scan_ms = 4000
# editor_command = "blueman-manager"
# editor_icon = "\U000f0493"
# editor_label = "Správca"

[monitor]
bus = "10"
width = 350
font_size = 17
night_switcher = "~/.config/dynamic-island/scripts/bluelight.sh"
night_state    = "pgrep -x wlsunset"     # voliteľné
night_label    = "Filter modráho svetla"           # voliteľné
# voliteľné (predvolené sú pre tvoj Iiyama):
# presets = [5, 6, 8]
# preset_labels = ["6500 K", "7500 K", "9300 K"]
# inputs = [15, 17]
# input_labels = ["DisplayPort", "HDMI"]

# Snímka obrazovky / nahrávanie videa (grim, slurp, wf-recorder). Otvorí sa akciou "capture"
# (položka menu `module:capture`, záložka kontajnera `tab9 = "capture"`, tlačidlo `inversetab`).
[capture]
dir = "~/Obrázky/Screenshots"
video_dir = "~/Obrázky/Screenshots"
name = "%Y-%m-%d_%H-%M-%S"   # vzor názvu súboru (strftime)
delays = [0, 3, 5, 10]       # ponúkané časovače v sekundách
mode = "screen"              # predvolená oblasť: screen | window | region
kind = "image"               # predvolený typ: image | video
width = 380
font_size = 17
slurp_args = "-b #00000030 -w 0"   # vzhľad výberu slurp (nahrádza nepodporovaný kľúč slurp_bg)
# cursor = false             # kurzor myši na snímke
# audio = false              # zvuk pri nahrávaní
# format = "png"             # png | jpeg
# video_ext = "mp4"          # mp4 | mkv | webm
# recorder_args = ""         # ďalšie argumenty pre wf-recorder, napr. "-c h264_vaapi -d /dev/dri/renderD128"
copy = false                # snímku skopírovať do schránky (wl-copy)
# notify = true              # po uložení poslať notifikáciu (notify-send)
# hide_bar = true            # pri snímke dočasne skryť ostrovček


# ============================================================================
# 6. HUD A SYSTÉM
# ============================================================================

[brightness]          # HUD jasu; skratky nastav vo wayfire.ini (pozri README)
step = 10
get  = "lumix get"
set  = "lumix set \"{value}\""   # {value} = "10+", "10-" alebo číslo; v výstupe sa hľadá NN%
# icons = [...]

# Natívne zdroje dashboardu (exec = "builtin:…")
[system]
# decimal = ","            # desatinný oddeľovač vo výstupe ("," alebo ".")
# net_interface = ""      # rozhranie pre net-down / net-up; prázdne = rozhranie s predvolenou trasou

[autohide]            # vyžaduje Wayfire ipc + ipc-rules
enabled = true
bar_height = 40
edge = 2
edge_width = 30
margin = 0
poll_ms = 30
ignore = []


# ============================================================================
# 7. NOTIFIKÁCIE
# ============================================================================

# Notifikácie (náhrada maka): ostrovček je server org.freedesktop.Notifications.
# Farby sú rovnaké ako ostrovček; urgentné majú vlastný rámik a text:
[notifications]
enabled = true
history = true          # ukladať históriu (JSON riadky) vedľa konfigurácie
history_max = 1000      # koľko posledných záznamov ponechať
# history_file = "~/.config/dynamic-island/notifications.log"
width = 450
max_visible = 3
max_lines = 3
font_size = 16
align = "center"          # "center" alebo "left"
timeout_ms = 10000        # ak aplikácia nepošle vlastný; 0 = nevyprší
on_click = "default-action"   # akcia "default" aplikácie + zavrieť; "dismiss"; alebo príkaz (napr. tvoj mako_action.sh)
on_click_right = "update.sh"    # stredné tlačidlo zavrie všetky
icons = true              # ikony notifikácií (image-data / image-path / app_icon; len PNG, inak písmeno aplikácie)
# Panel histórie notifikácií (otvorí ho akcia "notifications": on_click* modulu alebo command = "module:notifications"):
panel_width = 480
panel_height = 520
panel_lines = 3           # najviac riadkov tela na kartu
[notifications.urgent]
timeout_ms = 0            # urgentné nevyprší, kým ich nezavrieš
border_size = 2
# farby urgentných v [colors]: urgent_border = "#fa3939", urgent_text = "#b1cbce"

# Pravidlá (náhrada skriptu s `makoctl list`): ak súhrn/aplikácia/telo obsahuje text, klik spustí príkaz
# a notifikáciu zavrie. Prvé zhodné pravidlo vyhrá. Vynechané polia sa neskúmajú.
[[notifications.rule]]
summary = "Debian Aktualizácie"
on_click = "foot bash -c 'sudo apt update && sudo apt -u -V upgrade; exec bash'"
# timeout_ms = 0


# ============================================================================
# 8. VLASTNÉ MENU
# Spúšťa sa on_click = "meno" na ľubovoľnom module; command môže byť aj iný modul (command = "module:calendar").
# ============================================================================

### Backup menu #################################################################
[[menu]]
name = "sysmenu"
# title = "Systémové nástroje a nastavenia"              # prázdne = bez nadpisu
icon_columns = 5           # ikony
text_columns = 2           # labely
icon_size = 52
text_size = 17
cell_width = 170
gap = 1
padding = 0
separator_thickness = 2
separator_length = 0.6
### Backup ###
[[menu.item]]
icon = "bleachbit.png"    # PNG v icons/ vedľa config.toml (alebo plná cesta)
command = "foot bash -c '/home/mm/.config/dynamic-island/scripts/cleansystem.sh; exec bash'"
[[menu.item]]
icon = "fsarchiver.png"
command = "foot bash -c '/home/mm/.config/dynamic-island/scripts/fsarchiver.sh; exec bash'"
[[menu.item]]
icon = "packages.png"
command = "apt-mark showmanual > /home/mm/Linux/Debian/packages_list.txt && notify-send -t 3000 'Zoznam naištalovaných balíkov bol aktualizovaný.'"
[[menu.item]]
icon = "dotfiles.png"
command = "foot bash -c '/home/mm/.config/dynamic-island/scripts/dotfilesbkp.sh; exec bash'"
[[menu.item]]
icon = "timeshift.png"
command = "timeshift-launcher"
[[menu.item]]
line = "Uptime: {}"
# command = ""
exec = "uptime -p | awk '{for(i=2;i<=NF;i+=2){n=$i;u=$(i+1);if(u~/day/)printf \"%s %s \",n,n==1?\"deň\":n<5?\"dni\":\"dní\";else if(u~/hour/)printf \"%s %s \",n,n==1?\"hodina\":n<5?\"hodiny\":\"hodín\";else if(u~/minute/)printf \"%s %s \",n,n==1?\"minúta\":n<5?\"minúty\":\"minút\"};print \"\"}'"
[[menu.item]]
separator = "center"
### Dashboard ###
# Natívne zdroje (bez skriptov): exec = "builtin:ZDROJ[:ARGUMENT]" – cpu, ram, ram-pct, swap, temp[:názov],
# disk[:cesta], disk-pct[:cesta], disk-free[:cesta], disk-total[:cesta], net-down, net-up. Pozri README (6.18b).
[[menu.item]]
label = "CPU: {} %"
exec = "builtin:cpu"
interval = 2
[[menu.item]]
label = "RAM: {}"
exec = "builtin:ram"                       # využitá pamäť v GB; builtin:ram-pct = v %
interval = 2

[[menu.item]]
label = "↓ {}"
exec = "builtin:net-down"
interval = 2
[[menu.item]]
label = "↑ {}"
exec = "builtin:net-up"
interval = 2
[[menu.item]]
separator = "center"

[[menu.item]]
line = "Root: {}"
exec = "builtin:disk:/"   # uprav na svoj pripojný bod
[[menu.item]]
