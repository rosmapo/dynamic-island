# [[menu.item]]
# separator = "center"
[[menu.item]]
separator = "center"

# [[menu.item]]
# label = "Teplota: {}"
# exec = "builtin:temp"                     # builtin:temp:NÁZOV = konkrétny snímač (napr. coretemp, nvme)
# interval = 5
[[menu.item]]
